# ═══════════════════════════════════════════════════════════════
#  微信 AI 助手 · Docker 一键部署
#
#  用法：
#      docker compose up -d
#      然后打开 http://127.0.0.1:8000
#
#  说明：
#      本应用自身零外部依赖（配置存 JSON、消息存本地文件），
#      无需数据库，因此只需要「协议网关 + 主程序」两个容器。
# ═══════════════════════════════════════════════════════════════

services:

  # ── 微信协议网关（iPad 协议，支持私聊 + 群聊）────────────────
  # 如果你使用 GeWe 云端 SaaS，可以删掉这个容器，
  # 并在管理界面把「网关地址」改成 https://api.geweapi.com/gewe
  gateway:
    image: registry.cn-hangzhou.aliyuncs.com/gewe/gewe:latest
    container_name: wxbot-gateway
    privileged: true
    ports:
      - "2531:2531"
      - "2532:2532"
    volumes:
      - ./data/gateway:/root/temp
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped

  # ── 主程序（管理界面 + 机器人引擎）──────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wxbot-app
    ports:
      - "8000:8000"
    environment:
      - TZ=Asia/Shanghai
      - WXBOT_HOST=0.0.0.0
      - WXBOT_PORT=8000
      - WXBOT_DATA_DIR=/app/data
      - WXBOT_NO_BROWSER=1
      # 让容器内的「网关地址」默认指向 gateway 服务
      - WXBOT_DEFAULT_GATEWAY=http://gateway:2531
    volumes:
      - ./data/app:/app/data
    depends_on:
      - gateway
    restart: unless-stopped
