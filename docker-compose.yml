# ═══════════════════════════════════════════════════════════════
#  微信 AI 助手 · Docker 部署（仅主程序）
#
#  用法：
#      docker compose up -d
#      然后打开 http://127.0.0.1:8000
#
#  说明：
#      主程序使用本地 JSON/文件，无需额外数据库；聊天依赖所配置的模型服务。
#      微信走腾讯官方 iLink，扫码即用，**不需要任何网关容器**。
#      QQ 通道的 NapCat 网关由程序在界面上「一键部署」，
#      因此只有用 QQ 时才需要挂载 Docker socket（见下方注释）。
# ═══════════════════════════════════════════════════════════════

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wxbot-app
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - TZ=Asia/Shanghai
      - WXBOT_HOST=0.0.0.0
      - WXBOT_PORT=8000
      - WXBOT_DATA_DIR=/app/data
      - WXBOT_MIGRATE_LEGACY=1
      - 'WXBOT_LEGACY_DATA_DIRS=["/app/legacy-data"]'
      - WXBOT_NO_BROWSER=1
      - WXBOT_ADMIN_TOKEN=${WXBOT_ADMIN_TOKEN:-}
    volumes:
      # 宿主机用户目录，不放在项目/镜像内；可用 WXBOT_HOST_DATA_DIR 自定义。
      - ${WXBOT_HOST_DATA_DIR:-${HOME}/.local/share/wxbot/user-data}:/app/data
      # 旧版数据只读挂载，首次启动复制迁移；原目录不删除。
      - ./data:/app/legacy-data:ro
      # ── 要用「一键部署 QQ 网关」时再打开下面这行 ──────────────
      # 程序需要调用宿主机的 Docker 来启动 NapCat 容器。
      # 挂载 Docker socket 等同于把宿主机 root 权限交给该容器，
      # 请自行评估；不想挂就用桌面版或命令行方式运行。
      # - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
