# ═══════════════════════════════════════════════════════════════
#  electron-builder 打包配置
#
#  产出：
#    macOS   → dist/WxBot-${version}-macOS-${arch}.dmg
#    Windows → dist/WxBot-${version}-Windows-x64-Setup.exe（NSIS 安装包）
#              dist/WxBot-${version}-Windows-x64-Portable.exe（免安装单文件）
# ═══════════════════════════════════════════════════════════════

appId: com.siriuspeng.wxbot
productName: 微信AI助手
copyright: Copyright © 2026 Sirius-Peng

directories:
  output: dist
  buildResources: assets

# 打进 asar 的文件
files:
  - src/**/*
  - assets/**/*
  - package.json
  - '!**/*.map'

# 不打进 asar、以独立文件形式放在 Resources/ 下
extraResources:
  # 网页界面（Python 后端直接读这个目录）
  - from: ../src/web
    to: web
  # Python 后端：macOS onefile / Windows onedir（由对应原生脚本产出）
  - from: resources/backend
    to: backend
  # 图标资源
  - from: assets
    to: assets

# ── macOS ────────────────────────────────────────────────────
mac:
  category: public.app-category.productivity
  icon: assets/icon.icns
  darkModeSupport: true

  # ⚠️ 架构必须显式且唯一，且只能有一个。
  #
  # 踩坑记录：这里曾写成 arch: [arm64, x64]，结果命令行的 --arm64 并未覆盖它，
  # 两个架构都被构建，而最终产出的 DMG 落到了 x64 那份上。用户装到
  # Apple Silicon 机器上，macOS 会提示"此应用为 Intel 芯片设计，将来不会再被支持"，
  # 且只能通过 Rosetta 运行。
  #
  # 需要 Intel 版时，用 npm run pack:mac:x64（它会在命令行覆盖为 x64），
  # 不要在这里同时写两个架构。
  target:
    - target: dmg
      arch: [arm64]

  # 产物名带上架构，避免再次出现"分不清哪个包是哪个架构"
  artifactName: WxBot-${version}-macOS-${arch}.${ext}

  # 应用需要访问网络（调大模型 API 与微信网关）
  extendInfo:
    NSHumanReadableCopyright: Copyright © 2026 Sirius-Peng
    LSMinimumSystemVersion: '11.0'

  # 未签名分发时，用户首次打开需右键→打开
  identity: null

dmg:
  title: 微信 AI 助手 ${version}
  contents:
    - x: 140
      y: 200
      type: file
    - x: 400
      y: 200
      type: link
      path: /Applications

# ── Windows ──────────────────────────────────────────────────
win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  # 若需指定签名证书，在此配置 certificateFile / certificatePassword

nsis:
  oneClick: false                      # 显示安装向导，用户可自选目录
  perMachine: false                    # 按用户安装，无需管理员权限
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 微信 AI 助手
  deleteAppDataOnUninstall: false      # 保留旧版 profile；实际数据独立放在 LocalAppData/WxBot/user-data
  artifactName: WxBot-${version}-Windows-${arch}-Setup.${ext}

portable:
  artifactName: WxBot-${version}-Windows-${arch}-Portable.${ext}

# ── Linux（可选，配置留好方便扩展）──────────────────────────
linux:
  icon: assets/icon.png
  category: Utility
  target:
    - AppImage
