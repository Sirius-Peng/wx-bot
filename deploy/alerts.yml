groups:
  - name: wx-bot-critical
    rules:
      # 登录态失效 —— 最致命的故障，秒级告警
      - alert: GatewayUnhealthy
        expr: gateway_health == 0
        for: 60s
        labels: { severity: critical }
        annotations:
          summary: "微信网关登录态失效，机器人已离线"

      # 消息积压 —— 触发降级
      - alert: QueueBacklog
        expr: queue_depth > 1000
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "消息队列积压超过 1000，建议启用降级策略"

      # 主模型异常 —— 频繁降级
      - alert: LLMFrequentFallback
        expr: increase(llm_fallback_total[5m]) > 10
        labels: { severity: warning }
        annotations:
          summary: "主模型 5 分钟内降级超过 10 次，检查供应商状态"

      # 单群发言过密 —— 风控前兆
      - alert: SuspiciousBurst
        expr: sum by (chat_id) (increase(bot_replies_sent_total[5m])) > 5
        labels: { severity: warning }
        annotations:
          summary: "单群 5 分钟内发言超过 5 条，疑似触发风控，建议人工介入"
